<svg width="1280" height="156" viewBox="0 0 1280 156" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg: #030712;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --accent1: #7C3AED;
      --accent2: #22D3EE;
      --accent3: #10B981;
      --pillBg: rgba(255,255,255,0.05);
      --pillBorder: rgba(255,255,255,0.14);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --text: #0F172A;
        --muted: #64748B;
        --accent1: #2563EB;
        --accent2: #06B6D4;
        --accent3: #10B981;
        --pillBg: rgba(15,23,42,0.035);
        --pillBorder: rgba(15,23,42,0.14);
      }
    }
    text { font-family: -apple-system, "Segoe UI", ui-sans-serif, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
  </style>

  <defs>
    <linearGradient id="accentCTA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--accent1)"/>
      <stop offset="50%" stop-color="var(--accent2)"/>
      <stop offset="100%" stop-color="var(--accent3)"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowCTA1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--accent1)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--accent1)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCTA2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--accent3)" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="var(--accent3)" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClipCTA"><rect width="1280" height="156" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#cardClipCTA)">
    <rect width="1280" height="156" fill="var(--bg)"/>
    <circle cx="100" cy="134" r="180" fill="url(#glowCTA1)">
      <animate attributeName="cy" values="134;106;134" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="22" r="200" fill="url(#glowCTA2)">
      <animate attributeName="cy" values="22;50;22" dur="11s" repeatCount="indefinite"/>
    </circle>
    <rect x="1.25" y="1.25" width="1277.5" height="153.5" rx="24.75" fill="none" stroke="url(#accentCTA)" stroke-opacity="0.55" stroke-width="1.5"/>

    <g class="mono" font-size="13" fill="url(#accentCTA)" text-anchor="middle" opacity="0">
      <animate attributeName="opacity" begin="0.1s" dur="0.7s" fill="freeze" values="0;1"/>
      <text x="640" y="46">&lt; LET'S BUILD SOMETHING GREAT /&gt;</text>
    </g>
    <text x="640" y="86" font-size="28" font-weight="700" fill="var(--text)" text-anchor="middle" opacity="0">Open to Frontend, BI &amp; ERP Opportunities<animate attributeName="opacity" begin="0.3s" dur="0.7s" fill="freeze" values="0;1"/></text>
    <text x="640" y="114" font-size="14" fill="var(--muted)" text-anchor="middle" opacity="0">Always glad to connect on new roles, internships, or collaborative projects &#8212; tap an icon below.<animate attributeName="opacity" begin="0.5s" dur="0.7s" fill="freeze" values="0;1"/></text>

    <g transform="translate(640,132)" text-anchor="middle" opacity="0"><animate attributeName="opacity" begin="0.7s" dur="0.7s" fill="freeze" values="0;1"/>
      <rect x="-118" y="-14" width="236" height="26" rx="13" fill="var(--pillBg)" stroke="var(--pillBorder)"/>
      <circle cx="-100" cy="-1" r="4" fill="var(--accent3)"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="-90" y="3" font-size="11.5" class="mono" fill="var(--text)" text-anchor="start">Typically replies within 24h</text>
    </g>
  </g>
</svg>
