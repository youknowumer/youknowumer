<svg width="1280" height="584" viewBox="0 0 1280 584" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg: #030712;
      --surface: #0b1120;
      --surface2: #10141f;
      --border: rgba(255,255,255,0.09);
      --border2: #20263a;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --muted2: #64748B;
      --accent1: #7C3AED;
      --accent2: #22D3EE;
      --accent3: #10B981;
      --accent4: #F59E0B;
      --accent5: #FB7185;
      --pillBg: rgba(255,255,255,0.05);
      --pillBorder: rgba(255,255,255,0.14);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --surface: #F8FAFC;
        --surface2: #F1F5F9;
        --border: rgba(15,23,42,0.09);
        --border2: #E2E8F0;
        --text: #0F172A;
        --muted: #64748B;
        --muted2: #94A3B8;
        --accent1: #2563EB;
        --accent2: #06B6D4;
        --accent3: #059669;
        --accent4: #D97706;
        --accent5: #E11D48;
        --pillBg: rgba(15,23,42,0.035);
        --pillBorder: rgba(15,23,42,0.14);
      }
    }
    text { font-family: -apple-system, "Segoe UI", ui-sans-serif, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
</style>
  <defs>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
