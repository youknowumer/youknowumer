  <stop offset="100%" stop-color="#151a29"/>
</linearGradient>
<filter id="robotGlow" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

