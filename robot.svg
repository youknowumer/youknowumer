<text x="490" y="116" font-family="-apple-system, 'Segoe UI', ui-sans-serif, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="var(--text)">Hey, I’m building the future — one workflow at a time.</text><text x="490" y="142" font-family="-apple-system, 'Segoe UI', ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--muted)">Frontend interfaces, BI dashboards, and ERP systems,</text><text x="490" y="162" font-family="-apple-system, 'Segoe UI', ui-sans-serif, Helvetica, Arial, sans-serif" font-size="12.5" fill="var(--muted)">engineered with precision and a product mindset.</text><rect x="490.00" y="184" width="73.80" height="52" rx="12" fill="var(--surface)" stroke="var(--accent3)" stroke-opacity="0.4" stroke-width="1"/><text x="507.00" y="204" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1" fill="var(--muted)">UPTIME</text><text x="507.00" y="226" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="var(--accent3)">99.9%</text><rect x="575.80" y="184" width="87.41" height="52" rx="12" fill="var(--surface)" stroke="var(--accent1)" stroke-opacity="0.4" stroke-width="1"/><text x="592.80" y="204" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1" fill="var(--muted)">MODE</text><text x="592.80" y="226" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="var(--accent1)">COLLAB</text><rect x="675.22" y="184" width="95.76" height="52" rx="12" fill="var(--surface)" stroke="var(--accent4)" stroke-opacity="0.4" stroke-width="1"/><text x="692.22" y="204" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1" fill="var(--muted)">FOCUS</text><text x="692.22" y="226" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="var(--accent4)">SHIPPING</text><text x="490" y="272" font-family="-apple-system, 'Segoe UI', ui-sans-serif, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="var(--muted)">CORE MODULES</text><circle cx="494.0" cy="294" r="3" fill="var(--accent1)"><animate attributeName="opacity" values="1;0.35;1" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></circle>
