<svg width="160" height="172" viewBox="0 0 160 172" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg: #030712;
      --surface: #0b1120;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --pillBg: rgba(255,255,255,0.05);
      --pillBorder: rgba(255,255,255,0.16);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --surface: #F8FAFC;
        --text: #0F172A;
        --muted: #64748B;
        --pillBg: rgba(15,23,42,0.035);
        --pillBorder: rgba(15,23,42,0.14);
      }
    }
    text { font-family: -apple-system, "Segoe UI", ui-sans-serif, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
</style>
  <defs>
    <linearGradient id="accentGH" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="var(--accent1, #7C3AED)"/><stop offset="100%" stop-color="var(--accent2, #22D3EE)"/></linearGradient>
  </defs>
  <rect width="160" height="172" rx="20" fill="var(--bg)"/>
  <rect x="0.75" y="0.75" width="158.5" height="170.5" rx="19.25" fill="none" stroke="var(--pillBorder)" stroke-width="1"/>
  <g transform="translate(80,52)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -3;0 0" dur="3.2s" repeatCount="indefinite"/>
    <circle r="35" fill="none" stroke="url(#accentGH)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="1.5 5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="var(--pillBg)" stroke="url(#accentGH)" stroke-width="1.4">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M0-19c-10.5 0-19 8.5-19 19 0 8.4 5.5 15.5 13 18 1 .2 1.3-.4 1.3-1v-3.6c-5.3 1.1-6.4-2.5-6.4-2.5-.9-2.2-2.1-2.8-2.1-2.8-1.7-1.2.1-1.2.1-1.2 1.9.1 2.9 2 2.9 2 1.7 2.9 4.5 2.1 5.6 1.6.2-1.3.7-2.1 1.2-2.6-4.2-.5-8.6-2.1-8.6-9.3 0-2 .7-3.7 2-5-.2-.5-.9-2.5.2-5.2 0 0 1.6-.5 5.2 1.9 1.5-.4 3.1-.6 4.7-.6 1.6 0 3.2.2 4.7.6 3.6-2.4 5.2-1.9 5.2-1.9 1 2.7.4 4.7.2 5.2 1.3 1.4 2 3 2 5 0 7.2-4.4 8.8-8.6 9.3.7.6 1.3 1.8 1.3 3.6v5.3c0 .6.3 1.2 1.3 1 7.5-2.5 13-9.6 13-18 0-10.5-8.5-19-19-19z" fill="var(--text)"/>
  </g>
  <text x="80" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text)">GitHub</text>
  <text x="80" y="150" text-anchor="middle" font-size="11" class="mono" fill="var(--muted)">@youknowumer</text>
