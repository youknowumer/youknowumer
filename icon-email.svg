<svg width="160" height="172" viewBox="0 0 160 172" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bg: #030712;
      --surface: #0b1120;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --pillBg: rgba(255,255,255,0.05);
      --pillBorder: rgba(255,255,255,0.16);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --surface: #F8FAFC;
        --text: #0F172A;
        --muted: #64748B;
        --pillBg: rgba(15,23,42,0.035);
        --pillBorder: rgba(15,23,42,0.14);
      }
    }
    text { font-family: -apple-system, "Segoe UI", ui-sans-serif, Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
</style>
  <defs>
    <linearGradient id="accentEM" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="var(--accent3, #10B981)"/><stop offset="100%" stop-color="var(--accent1, #7C3AED)"/></linearGradient>
  </defs>
  <rect width="160" height="172" rx="20" fill="var(--bg)"/>
  <rect x="0.75" y="0.75" width="158.5" height="170.5" rx="19.25" fill="none" stroke="var(--pillBorder)" stroke-width="1"/>
  <g transform="translate(80,52)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -3;0 0" dur="3.2s" repeatCount="indefinite"/>
    <circle r="35" fill="none" stroke="url(#accentEM)" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="1.5 5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="var(--pillBg)" stroke="url(#accentEM)" stroke-width="1.4">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M-14-9 0 3 14-9 M-14-10 h28 v18 h-28 z" stroke="var(--text)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
  </g>
  <text x="80" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text)">Email</text>
  <text x="80" y="150" text-anchor="middle" font-size="11" class="mono" fill="var(--muted)">Get in touch</text>
</svg>
