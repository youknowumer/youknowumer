<svg width="1280" height="40" viewBox="0 0 1280 40" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --accent1: #7C3AED;
      --accent2: #22D3EE;
      --accent3: #10B981;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --accent1: #2563EB;
        --accent2: #06B6D4;
        --accent3: #10B981;
      }
    }
  </style>
  <defs>
    <linearGradient id="accentD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent1)" stop-opacity="0"/>
      <stop offset="15%" stop-color="var(--accent1)" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="var(--accent2)" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="var(--accent3)" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="var(--accent3)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepD" x1="-30%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-30%;130%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;160%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <mask id="lineMaskD">
      <rect x="0" y="0" width="1280" height="40" fill="url(#accentD)"/>
    </mask>
  </defs>
  <line x1="0" y1="20" x2="1280" y2="20" stroke="url(#accentD)" stroke-width="1.5"/>
  <g mask="url(#lineMaskD)">
    <rect x="0" y="18.5" width="1280" height="3" fill="url(#sweepD)"/>
  </g>
  <rect x="632" y="15.5" width="17" height="9" rx="4.5" fill="none" stroke="url(#accentD)" stroke-width="1.5" transform="rotate(45 640 20)">
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 640 20" to="360 640 20" dur="18s" repeatCount="indefinite"/>
  </rect>
  <circle cx="640" cy="20" r="2.3" fill="var(--accent2)">
    <animate attributeName="r" values="1.7;3.1;1.7" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
